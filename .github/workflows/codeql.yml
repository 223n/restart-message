name: "CodeQL"

# Windows 専用の Go コード (//go:build windows, golang.org/x/sys/windows 等) を
# 確実に抽出するため、windows ランナーでネイティブビルドして解析します。

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    # git-flow では release/* と hotfix/* が main 宛になる。develop だけを対象に
    # していると、リリース直前のPRが一度も解析されないまま main へ入る。
    branches: ["develop", "main"]
  schedule:
    - cron: "30 2 * * 1" # 毎週月曜 02:30 UTC

permissions:
  contents: read

# 同一ブランチへ連続 push したときに解析が並走するのを止める。
# 過去に develop への2コミットが11秒差で並走した実績がある。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
