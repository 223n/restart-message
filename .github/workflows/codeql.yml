name: "CodeQL"

# Windows 専用の Go コード (//go:build windows, golang.org/x/sys/windows 等) を
# 確実に抽出するため、windows ランナーでネイティブビルドして解析します。

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    # git-flow では release/* と hotfix/* が main 宛になる。develop だけを対象に
    # していると、リリース直前のPRが一度も解析されないまま main へ入る。
    branches: ["develop", "main"]
  schedule:
    - cron: "30 2 * * 1" # 毎週月曜 02:30 UTC
  # 定期実行の分岐(下の matrix.branch)を月曜まで待たずに試せるようにするための手動実行。
  # 既定ブランチ(develop)から起動したときは「定期解析を今すぐ回す」とみなし、schedule と
  # 同じく develop と main の2本を解析する。それ以外のブランチから起動したときは、
  # 選んだブランチだけを解析する（release/* を選んだのに解析されるのは develop と main、
  # という取り違えを避けるため）。
  workflow_dispatch:

permissions:
  contents: read

# 同一ブランチへ連続 push したときに解析が並走するのを止める。
# 過去に develop への2コミットが11秒差で並走した実績がある。
#
# event_name を鍵に足しているのは、schedule の github.ref が既定ブランチ
# (refs/heads/develop)になり、develop への push と同じグループに入ってしまうため
# （workflow_dispatch も develop から起動すれば同じ状況になる。手動実行の github.ref は
# 「実行」画面で選んだブランチであって、既定ブランチとは限らない）。
# そのままだと push が「main を解析する唯一の実行」を巻き添えでキャンセルし、
# main は次の月曜まで解析されない。push 同士・PR 同士の相殺はこれまでどおり効く
# （github.ref が同じで event_name も同じため）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  analyze:
    # 分岐していないとき(push / pull_request)のジョブ名は従来どおり "Analyze (go)"。
    # ブランチ保護の必須チェック名を変えないため、ブランチ名は分岐時だけ付ける。
    name: Analyze (${{ matrix.language }}${{ matrix.branch && format(', {0}', matrix.branch) || '' }})
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # schedule は既定ブランチ(develop)でしか起動しないため、main は一度も
        # 定期解析されていなかった。定期実行のときは develop と main の2本に分岐する。
        # 手動実行は原則「選んだブランチを解析する」で、既定ブランチから起動したときだけ
        # 分岐する（上の workflow_dispatch のコメントを参照）。
        # push / pull_request は空文字1件 = 「トリガーした ref をそのまま」なので、
        # ジョブ数も挙動も従来と同じ（PRのCIを二重に回さない）。
        branch: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)) && '["develop","main"]' || '[""]') }}
        include:
          # branch 軸に無いキーなので、上の全組み合わせにそのまま追加される。
          - language: go
            build-mode: autobuild

    steps:
      # 定期実行なのに分岐していない = main が解析されないまま緑になる（ref/sha が
      # 空になり GITHUB_REF、つまり develop の解析結果だけが登録される）。
      # 黙って見逃すより、ここで落として気づけるようにする。
      # 手動実行は分岐しないのが正常なので、schedule に限定して判定する。
      - name: Check matrix fan-out
        if: github.event_name == 'schedule' && matrix.branch == ''
        shell: bash
        run: |
          echo "::error::matrix.branch が空です。定期解析の develop/main 分岐が効いていません"
          exit 1

      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          # 空文字はこの入力を未指定と同じに扱う(= トリガーした ref)。
          # 分岐時だけ develop / main を明示的にチェックアウトする。
          ref: ${{ matrix.branch }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # checkout より後に置くこと。分岐時はチェックアウトしたブランチの go.mod を
          # 読ませたい（main と develop で Go のバージョンが違い得る）。
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          # category は解析の同一性キー(automation ID)になる。ブランチごとに変えると
          # 既存の develop のアラートが別物として扱われるため、ここは固定のまま。
          # ブランチの区別は下の ref で付ける。
          category: "/language:${{ matrix.language }}"
          # 結果の登録先は既定で GITHUB_REF、つまり schedule では develop になる。
          # 明示しないと main を解析した結果まで develop のアラートとして登録される。
          # ref と sha は「片方だけ渡すとエラー」なので必ず対で渡す。分岐していない
          # (matrix.branch が空の)ときは両方を空文字＝未指定にして、従来どおり
          # GITHUB_REF / GITHUB_SHA に任せる（PR の merge ref 判定を壊さないため）。
          ref: ${{ matrix.branch && format('refs/heads/{0}', matrix.branch) || '' }}
          sha: ${{ matrix.branch && steps.checkout.outputs.commit || '' }}
